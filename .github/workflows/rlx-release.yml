name: Release

# Builds RLX Patches from main and publishes the release vX.Y.Z with the .mpp file, then points
# patches-bundle.json (read by Morphe Manager) and patches-list.json on main to it.
#
# The version is the one in rlx/rlx.properties. When that version is already released, the
# release is an RLX-only release: the version is raised by one first (rlx/scripts/next_version.py).
# Started by hand, or by the Morphe sync workflow after it merged a Morphe release.
#
# Unless 'publish' is selected, the release is a draft: only visible to the maintainers, no tag,
# and patches-bundle.json is not changed, so Morphe Manager users do not get it.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release for everyone (otherwise a draft, and Morphe Manager is not updated)"
        type: boolean
        default: false
      notes:
        description: "Extra release notes (optional, Markdown)"
        type: string
        default: ""

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # File times in the bundle in the time of the maintainers, not UTC.
  TZ: Asia/Dubai
  # Every JVM of the build (Gradle, its workers, d8) in the same time zone, so the times in the bundle are too.
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Dubai

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version
        id: version
        run: |
          python3 -m unittest discover -s rlx/scripts
          version="$(sed -n 's/^version=//p' rlx/rlx.properties)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            previous="$version"
            version="$(python3 rlx/scripts/next_version.py rlx "$previous" --tags-from-git)"
            echo "v$previous is already released, RLX-only release $version"
            sed -i "s/^version=.*/version=$version/" rlx/rlx.properties
            git add rlx/rlx.properties
            git commit -q -m "RLX $version"
          fi
          morphe="$(sed -n 's/^version *= *//p' gradle.properties | tr -d '[:space:]')"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "morphe=$morphe" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "RLX $version, based on Morphe $morphe (previous release: ${previous_tag:-none})"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The RLX signing key (Base64 Ed25519). The patches plugin signs the .mpp with it and checks it
          # against morphe-signing.pub, the RLX public key; Morphe Manager checks the file against the
          # public_key of patches-bundle.json.
          MORPHE_SIGNING_KEY: ${{ secrets.RLX_SIGNING_KEY }}
        run: |
          if [[ -z "$MORPHE_SIGNING_KEY" ]]; then
            echo "::error::The RLX_SIGNING_KEY secret is missing: releases are signed (see rlx/README.md)"
            exit 1
          fi
          ./gradlew -q printVersions --no-daemon
          ./gradlew :patches:generatePatchesList --no-daemon
          ./gradlew :patches:buildAndroid --no-daemon
          mpp="patches/build/libs/rlx-patches-${{ steps.version.outputs.version }}.mpp"
          test -f "$mpp" || { echo "::error::$mpp was not built"; ls patches/build/libs; exit 1; }
          if unzip -l "$mpp" | grep -E 'app/morphe/patches/reddit/|extensions/reddit\.mpe'; then
            echo "::error::Reddit is not excluded from the bundle"
            exit 1
          fi
          if ! unzip -z "$mpp" | grep -q '^MorpheSig1 '; then
            echo "::error::$mpp is not signed"
            exit 1
          fi

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MORPHE: ${{ steps.version.outputs.morphe }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout

          version, morphe = os.environ["VERSION"], os.environ["MORPHE"]
          lines = [f"Based on **Morphe Patches {morphe}** · "
                   f"[Morphe release notes](https://github.com/MorpheApp/morphe-patches/releases/tag/v{morphe})", ""]

          # Supported app versions, from the patches list of this build: the newest recommended one, and the
          # newest one at all (newer ones are experimental in Morphe Manager).
          def key(v):
              return [int(x) if x.isdigit() else 0 for x in re.split(r"[.-]", v)]
          supported = []
          patches = json.load(open("patches-list.json", encoding="utf-8"))["patches"]
          for app in ("YouTube", "YouTube Music"):
              stable, every = set(), set()
              for patch in patches:
                  for package in patch.get("compatiblePackages") or []:
                      if package.get("name") != app:
                          continue
                      for target in package.get("targets") or []:
                          every.add(target["version"])
                          if not target.get("isExperimental"):
                              stable.add(target["version"])
              if not every:
                  continue
              text = f"**{app}** {max(stable, key=key)}" if stable else f"**{app}**"
              newest = max(every, key=key)
              if not stable or key(newest) > key(max(stable, key=key)):
                  text += f" (up to {newest}, experimental)"
              supported.append(text)
          if supported:
              lines += ["Supported: " + " · ".join(supported), ""]

          extra = os.environ.get("EXTRA_NOTES", "").strip()
          if extra:
              lines += [extra, ""]

          # RLX changes since the last release: the first parents of main (pull requests by their title, direct
          # commits by their subject), without Morphe's history and merges. The first release lists what RLX
          # adds to Morphe Patches instead (rlx/first-release.md).
          start = os.environ.get("PREVIOUS_TAG")
          changes = []
          log = git("log", "--first-parent", "--format=%s%x1f%b%x1e", f"{start}..HEAD") if start else ""
          for entry in log.split("\x1e"):
              if not entry.strip():
                  continue
              subject, _, body = entry.strip().partition("\x1f")
              pull = re.match(r"Merge pull request #(\d+) ", subject)
              if pull:
                  title = body.strip().splitlines()[0] if body.strip() else subject
                  changes.append(f"* {title} (#{pull.group(1)})")
              elif not re.match(r"(Merge |RLX [0-9.]+$|Release v[0-9.]+)", subject):
                  changes.append(f"* {subject}")
          if changes:
              lines += ["### RLX changes", "", *changes, ""]
          elif not start:
              lines += [open("rlx/first-release.md", encoding="utf-8").read().strip(), ""]

          lines += [
              "### Install",
              "",
              "1. Install [Morphe Manager](https://morphe.software).",
              "2. [Add RLX Patches to Morphe Manager](https://morphe.software/add-source?github=Ramik4/rlx-patches&name=RLX%20Patches),"
              " or add `https://github.com/Ramik4/rlx-patches` under *Sources → + → Remote*.",
              "3. Patch YouTube or YouTube Music with the RLX Patches source.",
              "",
              f"`rlx-patches-{version}.mpp` is signed with the RLX key; Morphe Manager checks it.",
          ]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "notes.md"), "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
          cat "$RUNNER_TEMP/notes.md"

      - name: Draft release
        if: ${{ !inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin HEAD:main
          # Drafts of earlier runs (this version or others) are replaced, so there is one draft at most.
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
            | while read -r tag; do gh release delete "$tag" --yes; done
          gh release create "v$VERSION" \
            "patches/build/libs/rlx-patches-$VERSION.mpp" \
            --draft \
            --target "$(git rev-parse HEAD)" \
            --title "RLX Patches $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Draft release v$VERSION created; patches-bundle.json is unchanged" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MORPHE: ${{ steps.version.outputs.morphe }}
        run: |
          # Drafts are not needed once the release is published.
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
            | while read -r tag; do gh release delete "$tag" --yes; done
          # The tag is the commit that was built. The bundle files on main are updated after the
          # file is uploaded, so Morphe Manager never sees a link to a missing file.
          git tag -a "v$VERSION" -m "RLX Patches $VERSION, based on Morphe $MORPHE"
          git push origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" \
            "patches/build/libs/rlx-patches-$VERSION.mpp" \
            --verify-tag \
            --title "RLX Patches $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update patches-bundle.json and patches-list.json
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MORPHE: ${{ steps.version.outputs.morphe }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib
          version, morphe = os.environ["VERSION"], os.environ["MORPHE"]
          bundle = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": f"RLX Patches {version}\n\nBased on Morphe {morphe}",
              "download_url": f"https://github.com/Ramik4/rlx-patches/releases/download/v{version}/rlx-patches-{version}.mpp",
              "signature_download_url": "",
              "version": version,
              # The RLX public key: Morphe Manager refuses a file that was not signed with the RLX key.
              "public_key": pathlib.Path("morphe-signing.pub").read_text().strip(),
          }
          pathlib.Path("patches-bundle.json").write_text(json.dumps(bundle, indent=2, ensure_ascii=False) + "\n")
          EOF
          git add patches-bundle.json patches-list.json
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git commit -q -m "Release v$VERSION [skip ci]" -m "Based on Morphe $MORPHE"
          git push origin HEAD:main
