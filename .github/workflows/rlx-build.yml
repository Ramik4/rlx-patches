name: Build

on:
  push:
    branches-ignore:
      - upstream
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # File times (in the bundle and in the zip of the artifact) in the time of the maintainers, not UTC.
  TZ: Europe/Istanbul

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Version script tests
        run: python3 -m unittest discover -s rlx/scripts

      # buildAndroid adds DEX to the jar in place, so it runs last.
      # Test builds are named rlx-patches-<version>-build<run number>.mpp (rlx/patches.gradle.kts).
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RLX_BUILD: ${{ github.run_number }}
        run: |
          ./gradlew -q printVersions --no-daemon
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Check bundle
        id: bundle
        run: |
          mpp="$(ls patches/build/libs/rlx-patches-*.mpp)"
          echo "$mpp"
          case "$mpp" in
            *-build${{ github.run_number }}.mpp) ;;
            *) echo "::error::The test build is not named after the run: $mpp"; exit 1 ;;
          esac
          echo "mpp_name=$(basename "$mpp" .mpp)" >> "$GITHUB_OUTPUT"
          unzip -p "$mpp" META-INF/MANIFEST.MF
          if unzip -l "$mpp" | grep -E 'app/morphe/patches/reddit/|extensions/reddit\.mpe'; then
            echo "::error::Reddit is not excluded from the bundle"
            exit 1
          fi
          for entry in app/rlx/build.properties app/rlx/defaults.json \
                       rlx/drawable/rlx_settings_screen_customizations.xml rlx/settings/drawable/morphe_settings_icon_light.xml \
                       addresources/values/rlx/strings.xml addresources/values/rlx/arrays.xml \
                       addresources/values/rlx-youtube/strings.xml addresources/values/rlx-music/strings.xml \
                       addresources/values/rlx-shared/strings.xml addresources/values/rlx-shared/arrays.xml \
                       rlx/branding/youtube/raw/rlx_startup_animation.json rlx/branding/music/raw/rlx_startup_animation.json \
                       rlx/branding/youtube/raw/rlx_startup_animation_green.json \
                       rlx/drawable/rlx_settings_screen_downloads.xml rlx/drawable/rlx_settings_screen_community_bold.xml \
                       rlx/drawable/morphe_yt_yandex_vot.xml rlx/drawable/morphe_yt_yandex_vot_bold.xml \
                       rlx/drawable/morphe_offline_play.xml \
                       rlx/drawable/rlx_header_red_youtube_light.xml rlx/drawable/rlx_header_music_red_dark.xml \
                       rlx/branding/youtube/drawable/morphe_adaptive_foreground_play.xml \
                       rlx/branding/music/drawable/morphe_adaptive_foreground_play.xml; do
            unzip -l "$mpp" | grep -q " $entry$" || { echo "::error::Missing in the bundle: $entry"; exit 1; }
          done
          # RLX patches and extension classes. The .mpp and .mpe files hold DEX, so look for class names.
          contains() { (unzip -p "$1" 2>/dev/null || cat "$1") | grep -aq "$2"; }
          contains "$mpp" "app/rlx/patches/youtube/video/yandexvot" \
            || { echo "::error::Missing in the bundle: Yandex voice over translation patch"; exit 1; }
          unzip -p "$mpp" extensions/youtube.mpe > "$RUNNER_TEMP/youtube.mpe"
          contains "$RUNNER_TEMP/youtube.mpe" "Lapp/rlx/extension/youtube/yandexvot/YandexVot;" \
            || { echo "::error::Missing in the YouTube extension: Yandex voice over translation"; exit 1; }
          contains "$mpp" "app/rlx/patches/youtube/interaction/savetodevice" \
            || { echo "::error::Missing in the bundle: Save to device patch"; exit 1; }
          contains "$RUNNER_TEMP/youtube.mpe" "Lapp/rlx/extension/youtube/savetodevice/SaveToDevicePatch;" \
            || { echo "::error::Missing in the YouTube extension: Save to device"; exit 1; }
          contains "$RUNNER_TEMP/youtube.mpe" "Lapp/rlx/extension/youtube/savetodevice/SaveToDeviceResponse" \
            || { echo "::error::Missing in the YouTube extension: Save to device protobuf"; exit 1; }
          # Quick download menu (YTindir): shared-youtube code, in the extensions of both apps, and its strings.
          unzip -p "$mpp" extensions/music.mpe > "$RUNNER_TEMP/music.mpe"
          for ext in youtube music; do
            contains "$RUNNER_TEMP/$ext.mpe" "Lapp/rlx/extension/shared/downloads/QuickDownloadMenu;" \
              || { echo "::error::Missing in the $ext extension: quick download menu"; exit 1; }
          done
          unzip -p "$mpp" addresources/values/rlx/strings.xml | grep -q 'morphe_external_downloader_quick_download' \
            || { echo "::error::Missing in the bundle: strings of the quick download menu"; exit 1; }
          unzip -p "$mpp" addresources/values/rlx-music/strings.xml | grep -q 'morphe_external_downloader_quick_menu_title' \
            || { echo "::error::Missing in the bundle: YouTube Music strings of the quick download menu"; exit 1; }
          unzip -p "$mpp" app/rlx/build.properties

      - name: Upload patches
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.mpp_name }}
          path: patches/build/libs/rlx-patches-*.mpp
          if-no-files-found: error
